<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a1a" />
  <title>Offline · AI Companion</title>
  <style>
    :root {
      --bg: #0a0a1a;
      --card-bg: rgba(20, 18, 38, 0.78);
      --card-border: rgba(147, 129, 255, 0.22);
      --accent: #9381ff;
      --accent-glow: rgba(147, 129, 255, 0.35);
      --cyan: #72ddf7;
      --text: #f0f0ff;
      --muted: #a0a0c0;
      --danger: #ff6b81;
      --success: #2ed573;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 20%, #1b1638 0%, var(--bg) 70%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 520px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px var(--accent-glow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon-wrap {
      width: 84px;
      height: 84px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(147, 129, 255, 0.1);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--accent);
      animation: radar 2s infinite ease-out;
    }
    @keyframes radar {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .icon-svg {
      width: 42px;
      height: 42px;
      stroke: var(--accent);
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff 40%, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.lead {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--accent), #7965f5);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 16px rgba(147, 129, 255, 0.4);
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(147, 129, 255, 0.6);
    }
    .btn:active {
      transform: translateY(0);
    }
    .diagnostics {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      text-align: left;
    }
    .diag-item {
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
    }
    .diag-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .diag-status {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.red { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .dot.green { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .tips {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="container" role="main">
    <div class="icon-wrap" aria-hidden="true">
      <div class="pulse"></div>
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>Connection Paused</h1>
    <p class="lead">
      AI Companion is currently offline. Real-time voice processing and language models require internet access, but your session and preferences are safely stored.
    </p>

    <button id="retry-btn" class="btn" type="button" onclick="checkConnection()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Check Connection &amp; Reconnect
    </button>

    <section class="diagnostics" aria-label="System Diagnostics">
      <div class="diag-item">
        <div class="diag-label">Network</div>
        <div class="diag-status" id="net-status">
          <span class="dot red"></span> Disconnected
        </div>
      </div>
      <div class="diag-item">
        <div class="diag-label">Local Cache</div>
        <div class="diag-status" id="cache-status">
          <span class="dot green"></span> Ready
        </div>
      </div>
    </section>

    <p class="tips">
      Tip: The app will automatically reconnect as soon as network access is restored.
    </p>
  </main>

  <script>
    function updateStatus() {
      const isOnline = navigator.onLine;
      const netStatus = document.getElementById('net-status');
      if (netStatus) {
        netStatus.innerHTML = isOnline
          ? '<span class="dot green"></span> Connected'
          : '<span class="dot red"></span> Disconnected';
      }
      if (isOnline) {
        // Automatically attempt to reload when network returns
        window.location.reload();
      }
    }

    async function checkConnection() {
      const btn = document.getElementById('retry-btn');
      if (btn) btn.textContent = 'Checking connectivity...';
      try {
        const res = await fetch('/api/health', { method: 'GET', cache: 'no-store' });
        if (res.ok) {
          window.location.href = '/';
          return;
        }
      } catch (_) {}
      if (navigator.onLine) {
        window.location.href = '/';
      } else {
        if (btn) btn.textContent = 'Still Offline · Try Again';
      }
    }

    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
  </script>
</body>
</html>
